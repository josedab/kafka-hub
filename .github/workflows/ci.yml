name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · coverage · build · browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: https://kafka-hub.dev
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production environment
        run: pnpm check:production-env

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Coverage thresholds
        run: pnpm test:coverage

      - name: Production build
        run: pnpm build

      - name: Standalone health smoke
        shell: bash
        run: |
          set -euo pipefail

          PORT=3101 HOSTNAME=127.0.0.1 NODE_ENV=production \
            node .next/standalone/server.js &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if node -e "fetch('http://127.0.0.1:3101/api/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Standalone server did not become healthy."
              exit 1
            fi
            sleep 1
          done

          node -e "fetch('http://127.0.0.1:3101/api/health').then(async(response)=>{const payload=await response.json();if(response.status!==200||!response.headers.get('cache-control')?.includes('no-store')||payload.status!=='ok'||payload.features?.llm!=='disabled')process.exit(1)}).catch(()=>process.exit(1))"

      - name: Workspace package builds
        run: pnpm --recursive --filter "./packages/*" --if-present build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: pnpm test:browser

      - name: Production audit (informational — high/critical)
        continue-on-error: true
        run: |
          echo "Policy: report high/critical production advisories in PR CI without making an external advisory database a merge gate."
          pnpm audit --prod --audit-level high

      - name: CLI tarball smoke test
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          install_dir="$(mktemp -d)"

          pnpm --filter @kafka-hub/kafka-cli pack --pack-destination "$pack_dir"
          npm install \
            --prefix "$install_dir" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            "$pack_dir"/*.tgz

          set +e
          printf 'unclean.leader.election.enable=true\nacks=1\n' \
            | "$install_dir/node_modules/.bin/kafka-hub" diagnose - --min warning
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected CLI to exit 1 on danger findings, got $code"
            exit 1
          fi
          echo "CLI exited 1 as expected"
