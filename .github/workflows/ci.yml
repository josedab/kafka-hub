name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · coverage · build · browser
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Coverage thresholds
        run: pnpm test:coverage

      - name: Production build
        run: pnpm build

      - name: Workspace package builds
        run: pnpm --recursive --filter "./packages/*" --if-present build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: pnpm test:browser

      - name: Production audit (informational — high/critical)
        continue-on-error: true
        run: |
          echo "Policy: report high/critical production advisories in PR CI without making an external advisory database a merge gate."
          pnpm audit --prod --audit-level high

      - name: CLI tarball smoke test
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          install_dir="$(mktemp -d)"

          pnpm --filter @kafka-hub/kafka-cli pack --pack-destination "$pack_dir"
          npm install \
            --prefix "$install_dir" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            "$pack_dir"/*.tgz

          set +e
          printf 'unclean.leader.election.enable=true\nacks=1\n' \
            | "$install_dir/node_modules/.bin/kafka-hub" diagnose - --min warning
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected CLI to exit 1 on danger findings, got $code"
            exit 1
          fi
          echo "CLI exited 1 as expected"
